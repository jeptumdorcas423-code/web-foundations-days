<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>User Directory</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-bottom: 1rem;
    }
    input {
      padding: 8px;
      flex: 1;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
    .user-card {
      border: 1px solid #ccc;
      border-radius: 6px;
      padding: 12px;
      margin-bottom: 10px;
      list-style: none;
    }
    ul {
      padding: 0;
    }
  </style>
  <script src="users.js" defer></script>
</head>
<body>
  <h1>User Directory</h1>

  <div class="controls">
    <button id="load-users">Load Users</button>
    <label for="filter-input">
      Filter by name:
      <input id="filter-input" type="text" placeholder="Type a name...">
    </label>
  </div>

  <p id="status"></p>
  <ul id="users-list"></ul>
  
</body>
